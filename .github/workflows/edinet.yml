name: EDINET

on:
  schedule:
    # JST 平日 8:00。**UTC 23:00 は翌日のJSTになるので曜日は 0-4（日〜木）。**
    # 1-5 と書くとJSTの火〜土に流れる（月曜が来ず土曜に来る）。
    #
    # 前営業日ぶんの一覧は深夜（実測で翌01:09）に確定するため、朝に取れば
    # 前日の提出が漏れなく入る。寄り付き（9:00）の前に届くので判断に間に合う。
    - cron: '0 23 * * 0-4'

  workflow_dispatch:
    inputs:
      mode:
        description: '動かし方'
        required: true
        default: inspect
        type: choice
        options: [inspect, dry-run, send]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      # 書類一覧を読むだけ。Firestoreにも触れず通知も送らない
      - name: 構造を確認する
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'inspect'
        run: python scripts/edinet.py --inspect
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}

      - name: 取り込む（通知は送らない）
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
        run: python scripts/edinet.py
        env:
          DRY_RUN: '1'
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: 取り込んで通知する
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'send')
        run: python scripts/edinet.py
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
