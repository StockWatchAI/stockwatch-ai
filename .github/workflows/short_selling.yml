name: Short Selling

on:
  schedule:
    # JPXは毎営業日17時ごろに公表する。反映の遅れを見て 17:30 JST に取り込む。
    # JST は UTC+9 固定なので UTC 08:30 が JST 17:30。曜日は同じ暦日に収まるため 1-5。
    - cron: '30 8 * * 1-5'

  workflow_dispatch:
    inputs:
      mode:
        description: '動かし方'
        required: true
        default: inspect
        type: choice
        options: [inspect, dry-run, send]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      # 様式が変わったと疑うときに、認証情報を使わずに確かめられる。
      # 本番のデータに触れないので、いつ走らせても副作用が無い
      - name: 構造を確認する
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'inspect'
        run: python scripts/short_selling.py --inspect

      - name: 取り込む（通知は送らない）
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
        run: python scripts/short_selling.py
        env:
          DRY_RUN: '1'
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: 取り込んで通知する
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'send')
        run: python scripts/short_selling.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
